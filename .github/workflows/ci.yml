name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
      - run: pnpm build
      - run: pnpm check:package
      - name: Smoke test global installation
        shell: bash
        run: |
          temporary_root="$(cd "$RUNNER_TEMP" && pwd)"
          mkdir -p "$temporary_root/roastcli-package"
          npm pack --pack-destination "$temporary_root/roastcli-package"
          npm install --global --no-audit --no-fund --prefix "$temporary_root/roastcli-install" "$temporary_root/roastcli-package"/roastcli-*.tgz
          export PATH="$temporary_root/roastcli-install/bin:$temporary_root/roastcli-install:$PATH"
          test "$(roast --version)" = "$(node -p 'require("./package.json").version')"
          roast --help
          roast config --help
          installed_modules="$(npm root --global --prefix "$temporary_root/roastcli-install")"
          node scripts/check-installed-diagnostics.mjs "$installed_modules/roastcli"
