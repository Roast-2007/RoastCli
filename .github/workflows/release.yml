name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful cross-platform CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          passed="$(gh run list --workflow ci.yml --commit "$commit" --branch main --event push --limit 20 --json conclusion --jq 'any(.[]; .conclusion == "success")')"
          if [ "$passed" != "true" ]; then
            echo "This commit must pass the main branch CI on Linux, Windows and macOS before release."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        run: node -e 'if ("v" + require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - name: Pack release
        run: |
          mkdir release
          npm pack --pack-destination release
          mv release/roastcli-*.tgz release/roastcli.tgz
          cd release
          sha256sum roastcli.tgz > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          notes="docs/RELEASE-${version}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" || {
              echo "This release is already public; its assets will not be overwritten."
              exit 1
            }
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" release/roastcli.tgz release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/roastcli.tgz release/SHA256SUMS --verify-tag --draft --title "RoastCli $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
